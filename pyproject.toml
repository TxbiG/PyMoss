[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "PyMoss"
version = "0.1.0"
description = "Python bindings for the Moss game framework"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TxbiG" }]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: C++"]

[tool.scikit-build]
cmake.version = ">=3.20"
wheel.packages = ["python/pymoss"]

[tool.scikit-build.cmake.define]
MOSS_FRAMEWORK_DIR = "C:/Users/TobyG/Documents/MossFramework"