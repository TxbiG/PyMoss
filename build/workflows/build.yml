name: Build PyMoss

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - windows-2022
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:

      # ============================================================
      # Checkout PyMoss
      # ============================================================

      - name: Checkout PyMoss
        uses: actions/checkout@v4
        with:
          path: PyMoss

      # ============================================================
      # Checkout Moss dependency
      # ============================================================

      - name: Checkout Moss
        uses: actions/checkout@v4
        with:
          repository: TxbiG/Moss
          path: Moss
          submodules: recursive

      # ============================================================
      # Linux dependencies
      # ============================================================

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgl1-mesa-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev

      # ============================================================
      # macOS dependencies
      # ============================================================

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja

      # ============================================================
      # Configure Windows
      # ============================================================

      - name: Configure Windows
        if: runner.os == 'Windows'
        working-directory: PyMoss
        run: >
          cmake
          -S .
          -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DMOSS_FRAMEWORK_DIR="${{ github.workspace }}/Moss"

      # ============================================================
      # Configure Linux / macOS
      # ============================================================

      - name: Configure Linux/macOS
        if: runner.os != 'Windows'
        working-directory: PyMoss
        run: >
          cmake
          -S .
          -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DMOSS_FRAMEWORK_DIR="${{ github.workspace }}/Moss"

      # ============================================================
      # Build
      # ============================================================

      - name: Build PyMoss
        working-directory: PyMoss
        run: cmake --build build --config Debug